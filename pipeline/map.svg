<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1270 560" role="img" aria-label="Pipeline for one newsletter edition in three lanes. I take in ideas, select one and write a rough draft. Agents research, draft, check, add visuals and translate, with a gate after each stage. I approve the final version. Then the edition is sent, distributed, answered by readers and reviewed, and the answers feed the backlog.">
  <style>
    text { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; }
    .bg { fill: #ffffff; }
    .band { fill: #eceef4; }
    .lane { font-family: Menlo, Consolas, monospace; font-size: 12px; letter-spacing: 0.1em; fill: #586178; }
    .box { fill: #ffffff; stroke: #1a2233; stroke-width: 1; }
    .you { stroke-width: 2.25; }
    .agent { fill: #e3e8f6; }
    .out { stroke-dasharray: 5 4; }
    .approve { fill: #2440a8; stroke: #2440a8; }
    .gateband { fill: #ffffff; stroke: #1a2233; stroke-width: 1; stroke-dasharray: 5 4; }
    .t { font-size: 15px; font-weight: 600; fill: #1a2233; text-anchor: middle; }
    .d { font-size: 12.5px; fill: #1a2233; text-anchor: middle; }
    .on { fill: #ffffff; }
    .lbl { font-size: 12.5px; fill: #586178; }
    .flow { fill: none; stroke: #1a2233; stroke-width: 1.5; }
    .ask { fill: none; stroke: #1a2233; stroke-width: 1; stroke-dasharray: 3 4; }
    .gate { fill: #ffffff; stroke: #1a2233; stroke-width: 1.5; }
    .head { fill: #1a2233; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1270" height="560"/>

  <rect class="band" x="12" y="20" width="1246" height="162" rx="6"/>
  <rect class="band" x="12" y="200" width="1246" height="162" rx="6"/>
  <rect class="band" x="12" y="380" width="1246" height="162" rx="6"/>
  <text class="lane" x="60" y="46">I DECIDE</text>
  <text class="lane" x="60" y="226">AGENTS WORK</text>
  <text class="lane" x="60" y="406">PUBLISH AND LEARN</text>

  <rect class="box you" x="86" y="69" width="128" height="78" rx="4"/>
  <text class="t" x="150" y="95">1 Intake</text>
  <text class="d" x="150" y="115">Element thread,</text>
  <text class="d" x="150" y="131">voice note, bullets</text>

  <rect class="box you" x="250" y="69" width="128" height="78" rx="4"/>
  <text class="t" x="314" y="95">2 Select</text>
  <text class="d" x="314" y="115">I pick the</text>
  <text class="d" x="314" y="131">next edition</text>

  <rect class="box you" x="414" y="69" width="128" height="78" rx="4"/>
  <text class="t" x="478" y="95">3 Rough draft</text>
  <text class="d" x="478" y="115">mine, spoken</text>
  <text class="d" x="478" y="131">or written</text>

  <rect class="gateband" x="556" y="69" width="500" height="78" rx="4"/>
  <text class="t" x="806" y="95">Gate after each agent stage</text>
  <text class="d" x="806" y="115">Element ping with a link to the issue or pull request.</text>
  <text class="d" x="806" y="131">All gates are on at first. Single gates can be switched off later.</text>

  <rect class="box approve" x="1070" y="69" width="128" height="78" rx="4"/>
  <text class="t on" x="1134" y="95">9 Approve</text>
  <text class="d on" x="1134" y="115">final version,</text>
  <text class="d on" x="1134" y="131">always my yes</text>

  <rect class="box agent" x="414" y="249" width="128" height="78" rx="4"/>
  <text class="t" x="478" y="275">4 Research</text>
  <text class="d" x="478" y="295">Zotero, notes,</text>
  <text class="d" x="478" y="311">web</text>

  <rect class="box agent" x="578" y="249" width="128" height="78" rx="4"/>
  <text class="t" x="642" y="275">5 Draft</text>
  <text class="d" x="642" y="295">edition draft,</text>
  <text class="d" x="642" y="311">max. 1,000 words</text>

  <rect class="box agent" x="742" y="249" width="128" height="78" rx="4"/>
  <text class="t" x="806" y="275">6 Checks</text>
  <text class="d" x="806" y="295">length, facts,</text>
  <text class="d" x="806" y="311">links, AI tells</text>

  <rect class="box agent" x="906" y="249" width="128" height="78" rx="4"/>
  <text class="t" x="970" y="275">7 Visuals</text>
  <text class="d" x="970" y="295">charts and</text>
  <text class="d" x="970" y="311">images</text>

  <rect class="box agent" x="1070" y="249" width="128" height="78" rx="4"/>
  <text class="t" x="1134" y="275">8 Translate</text>
  <text class="d" x="1134" y="295">German and</text>
  <text class="d" x="1134" y="311">English versions</text>

  <rect class="box out" x="1070" y="429" width="128" height="78" rx="4"/>
  <text class="t" x="1134" y="455">10 Send</text>
  <text class="d" x="1134" y="475">Buttondown</text>
  <text class="d" x="1134" y="491">email</text>

  <rect class="box out" x="906" y="429" width="128" height="78" rx="4"/>
  <text class="t" x="970" y="455">11 Distribute</text>
  <text class="d" x="970" y="475">website, LinkedIn,</text>
  <text class="d" x="970" y="491">Bluesky, Mastodon</text>

  <rect class="box out" x="742" y="429" width="128" height="78" rx="4"/>
  <text class="t" x="806" y="455">12 Replies</text>
  <text class="d" x="806" y="475">readers answer</text>
  <text class="d" x="806" y="491">one question</text>

  <rect class="box you" x="578" y="429" width="128" height="78" rx="4"/>
  <text class="t" x="642" y="455">13 Review</text>
  <text class="d" x="642" y="475">open rate,</text>
  <text class="d" x="642" y="491">active readers</text>

  <line class="flow" x1="214" y1="108" x2="248" y2="108" marker-end="url(#arr)"/>
  <line class="flow" x1="378" y1="108" x2="412" y2="108" marker-end="url(#arr)"/>
  <line class="flow" x1="478" y1="147" x2="478" y2="247" marker-end="url(#arr)"/>
  <text class="lbl" x="488" y="195">hand over</text>

  <line class="ask" x1="560" y1="280" x2="560" y2="147"/>
  <line class="ask" x1="724" y1="280" x2="724" y2="147"/>
  <line class="ask" x1="888" y1="280" x2="888" y2="147"/>
  <line class="ask" x1="1052" y1="280" x2="1052" y2="147"/>

  <line class="flow" x1="542" y1="288" x2="576" y2="288" marker-end="url(#arr)"/>
  <line class="flow" x1="706" y1="288" x2="740" y2="288" marker-end="url(#arr)"/>
  <line class="flow" x1="870" y1="288" x2="904" y2="288" marker-end="url(#arr)"/>
  <line class="flow" x1="1034" y1="288" x2="1068" y2="288" marker-end="url(#arr)"/>
  <polygon class="gate" points="553,288 560,281 567,288 560,295"/>
  <polygon class="gate" points="717,288 724,281 731,288 724,295"/>
  <polygon class="gate" points="881,288 888,281 895,288 888,295"/>
  <polygon class="gate" points="1045,288 1052,281 1059,288 1052,295"/>

  <line class="flow" x1="1134" y1="249" x2="1134" y2="149" marker-end="url(#arr)"/>
  <text class="lbl" x="1144" y="195">final ping</text>

  <path class="flow" d="M1198 108 H1232 V468 H1200" marker-end="url(#arr)"/>
  <text class="lbl" x="1246" y="288" text-anchor="middle" transform="rotate(90 1246 288)">my yes</text>

  <line class="flow" x1="1070" y1="468" x2="1036" y2="468" marker-end="url(#arr)"/>
  <line class="flow" x1="906" y1="468" x2="872" y2="468" marker-end="url(#arr)"/>
  <line class="flow" x1="742" y1="468" x2="708" y2="468" marker-end="url(#arr)"/>

  <path class="flow" d="M578 468 H40 V108 H84" marker-end="url(#arr)"/>
  <text class="lbl" x="309" y="458" text-anchor="middle">answers and results feed the backlog</text>
</svg>
